<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geminus Assets</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geminus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --bg:#f4f4f2;--card:#fff;--ink:#0a0a0a;--mut:#6b6b6b;--line:#0a0a0a;--soft:#e9e9e6;
    --bad:#c62828;--ease:cubic-bezier(.2,.7,.2,1);--display:"Archivo Black",Impact,"Arial Black",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;font:16px/1.45 "Helvetica Neue",Helvetica,Arial,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  body.has-tabs main{padding-bottom:calc(92px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:#fff;text-decoration:none}
  .brand svg{width:22px;height:22px;flex:0 0 auto}
  .brand h1{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.08em;text-transform:uppercase;margin:0}
  header select{width:auto;max-width:46vw;background:#000;color:#fff;border:1px solid #fff;padding:6px 8px;font-size:13px;min-height:36px;cursor:pointer}
  #wsSelect{display:none!important}
  .wsbtn{flex:0 1 auto;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#000;color:#fff;border:1px solid #fff;padding:7px 10px;font-size:13px;min-height:36px;text-decoration:none;display:flex;align-items:center;gap:6px}
  .wsbtn::after{content:"▾";font-size:11px}
  .star{flex:0 0 auto;min-height:40px;min-width:40px;padding:0;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:18px;line-height:1}
  .star[aria-pressed="true"]{background:var(--ink);color:#fff}
  .item[data-open]{cursor:pointer}
  header button{min-height:36px;padding:6px 10px;font-size:12px}
  .avatar{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;border:1px solid #fff;font-family:var(--display);font-size:16px;text-decoration:none;text-transform:uppercase;transition:transform .12s var(--ease),box-shadow .15s var(--ease)}
  .avatar:active{transform:scale(.94)}
  @media (hover:hover){.avatar:hover{box-shadow:3px 3px 0 #fff;transform:translate(-2px,-2px)}}

  /* ---------- layout ---------- */
  main{max-width:760px;margin:0 auto;padding:18px 14px}
  h2{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:18px;margin:0 0 10px;line-height:1.15}
  h2.big{font-size:24px}
  .pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .pagehead h2{margin:0;font-size:22px}
  .count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .tagline{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:-2px 0 18px}
  .mut{color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}

  /* ---------- motion: every view rises in ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
  @keyframes flash{0%{background:#0a0a0a;color:#fff}100%{background:#fafafa;color:inherit}}
  @keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  #app>*{animation:rise .32s var(--ease) both}
  #app>*:nth-child(2){animation-delay:.04s}
  #app>*:nth-child(3){animation-delay:.08s}
  #app>*:nth-child(4){animation-delay:.12s}
  #app>*:nth-child(n+5){animation-delay:.16s}

  /* ---------- form controls ---------- */
  input,select,textarea{width:100%;padding:12px;min-height:46px;border:1px solid var(--line);border-radius:0;font:inherit;background:#fff;color:var(--ink);transition:box-shadow .15s var(--ease),transform .15s var(--ease)}
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
  textarea{min-height:92px;resize:vertical}
  button{padding:12px 16px;min-height:46px;border:1px solid var(--line);border-radius:0;text-transform:uppercase;letter-spacing:.07em;font:inherit;font-size:13px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s var(--ease),box-shadow .15s var(--ease),background .15s,color .15s}
  button:focus-visible,a:focus-visible{outline:3px solid #1f6feb;outline-offset:2px}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6;cursor:default}
  button.sec{background:#fff;color:var(--ink)}
  button.bad{background:var(--bad);border-color:var(--bad)}
  button.sm{min-height:38px;padding:8px 12px;font-size:12px}
  button.loading::after{content:"";display:inline-block;width:13px;height:13px;margin-left:9px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
  @media (hover:hover){
    button:not(:disabled):hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}
    button:not(:disabled):active{transform:scale(.97);box-shadow:none}
    button.sec:not(:disabled):hover{background:var(--ink);color:#fff}
    header button:not(:disabled):hover{box-shadow:3px 3px 0 #fff}
  }
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1}
  .row>button{flex:0 0 auto}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
  .pwwrap{position:relative}
  .pwwrap input{padding-right:70px}
  .pwwrap button{position:absolute;right:4px;top:4px;min-height:38px;padding:0 10px;font-size:11px}

  /* ---------- chips (record type) ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:40px;padding:8px 14px;background:#fff;color:var(--ink);font-size:12px}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ---------- list ---------- */
  .search{position:relative;margin-bottom:14px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;pointer-events:none}
  .search input{padding-left:40px}
  .item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);margin-bottom:10px;background:#fff;color:inherit;text-decoration:none;transition:transform .15s var(--ease),box-shadow .15s var(--ease);animation:rise .32s var(--ease) both}
  .item .t{flex:1;min-width:0}
  .item b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis}
  .item .arrow{font-size:20px;transition:transform .15s var(--ease)}
  .item:active{transform:scale(.985)}
  @media (hover:hover){.item:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink)}.item:hover .arrow{transform:translateX(4px)}}
  .tag{display:inline-block;padding:2px 8px;background:var(--ink);color:#fff;letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:6px}
  .tag.line{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:1px 7px}
  .empty{text-align:center;padding:34px 16px}
  .empty svg{width:56px;height:56px;stroke:var(--ink);fill:none;stroke-width:1.6;margin-bottom:10px}
  .empty p{margin:6px 0 16px;color:var(--mut)}

  /* skeleton */
  .skel{height:64px;margin-bottom:10px;border:1px solid var(--soft);background:linear-gradient(90deg,#ececea 0,#f7f7f5 150px,#ececea 300px);background-size:600px 100%;animation:shimmer 1.2s linear infinite}

  /* ---------- component detail ---------- */
  .qrframe{position:relative;width:min(230px,70%);margin:18px auto 6px;padding:16px;background:#fff;border:1px solid var(--line)}
  .qrframe::before,.qrframe::after{content:"";position:absolute;width:14px;height:14px;border:3px solid var(--ink)}
  .qrframe::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
  .qrframe::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
  .qr svg{width:100%;height:auto;display:block}
  .qrcap{text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .actions{margin-top:16px}
  .actions select{flex:0 0 auto;width:auto}
  .tl{position:relative;margin-top:6px;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--ink)}
  .rec{position:relative;padding:10px 12px;margin:0 0 12px;background:#fafafa;border:1px solid var(--soft)}
  .rec::before{content:"";position:absolute;left:-17px;top:16px;width:10px;height:10px;background:var(--ink);border:2px solid #fff;box-sizing:content-box;margin-left:-1px}
  .rec.flash{animation:flash 1.4s var(--ease)}
  .rec .meta{display:block;margin:4px 0 6px}

  /* ---------- labels page ---------- */
  .labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .label{border:1px dashed #888;padding:10px;text-align:center;background:#fff;break-inside:avoid}
  .label .q{width:130px;height:130px;margin:0 auto}
  .label .q svg{width:100%;height:100%}
  .label div.n{font-weight:700;font-size:13px;margin-top:4px;word-break:break-word}
  .label .tg{font-family:var(--display);font-size:20px;letter-spacing:.03em;margin-top:6px;line-height:1}

  /* ---------- bottom tab bar ---------- */
  #tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:flex;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;color:var(--mut);text-decoration:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase;position:relative;transition:color .15s}
  #tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;transition:transform .2s var(--ease)}
  #tabs a::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:3px;background:var(--ink);transform:translateX(-50%);transition:width .25s var(--ease)}
  #tabs a.on{color:var(--ink)}
  #tabs a.on::before{width:60%}
  #tabs a.on svg{transform:translateY(-1px) scale(1.08)}
  #tabs a:active svg{transform:scale(.88)}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none;padding:0 14px}
  .toast{background:var(--ink);color:#fff;padding:12px 18px;font-size:14px;letter-spacing:.02em;max-width:420px;animation:toastin .28s var(--ease) both;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
  .toast.bad{background:var(--bad)}
  .toast.out{opacity:0;transform:translateY(8px);transition:all .25s var(--ease)}

  /* ---------- stage 1: fields, locations, panels ---------- */
  .unitwrap{display:flex;align-items:stretch}
  .unitwrap input{flex:1;min-width:0}
  .unit{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-left:0;background:var(--soft);font-size:13px;letter-spacing:.04em;white-space:nowrap}
  .unit:empty{display:none}
  .kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:14px 1px 1px 1px}
  .kv{background:#fff;padding:10px 12px;min-width:0;border:1px solid var(--line);margin:0 -1px -1px 0}
  .kv span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .kv b{display:block;font-size:15px;word-break:break-word}
  .panel{border:1px solid var(--line);background:#fafafa;padding:14px;margin:10px 0 14px}
  .panel>label:first-child{margin-top:0}
  .filters{display:flex;gap:8px;margin-bottom:14px}
  .filters select{flex:1;min-width:0}
  .trow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--soft)}
  .trow .nm{flex:1;min-width:0;word-break:break-word}
  .trow button{flex:0 0 auto}
  .frow{padding:10px 0;border-top:1px solid var(--soft)}
  .frow .top{display:flex;align-items:center;gap:8px}
  .frow .top b{flex:1;min-width:0;word-break:break-word}
  .frow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  /* ---------- one-handed use: log sheet, log bar, big targets ---------- */
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;display:none}
  .sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:40;display:none;box-shadow:0 -6px 0 rgba(0,0,0,.15)}
  body.sheet-open{overflow:hidden}
  body.sheet-open .sheetbg,body.sheet-open .sheet{display:block}
  @keyframes sheetin{from{transform:translate(-50%,28px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  #app>.sheet,#app>.sheetbg,#app>.logbar{animation:none}
  body.sheet-open #app>.sheet{animation:sheetin .22s var(--ease) both}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .logbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:min(100%,760px);padding:0 14px;z-index:25}
  .logbar button{width:100%;min-height:58px;font-size:15px;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
  button.big{width:100%;min-height:58px;font-size:15px;margin-top:12px}
  body.has-logbar main{padding-bottom:calc(172px + env(safe-area-inset-bottom))}
  body.has-logbar #toasts{bottom:calc(150px + env(safe-area-inset-bottom))}
  .stepper{display:flex;gap:8px}
  .stepper input{text-align:center;font-size:18px;font-weight:700}
  .stepper button{flex:0 0 64px;font-size:24px;padding:0}
  .toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:10px}
  .toast .tact{background:transparent;border:1px solid #fff;color:#fff;min-height:40px;padding:6px 12px;font-size:12px}
  @media (pointer:coarse){.chip{min-height:48px;padding:10px 16px}.trk .acts button{min-height:48px}.star{min-height:48px;min-width:48px}}
  .warn{border-color:var(--bad);background:#fff5f5}
  .due{display:inline-block;padding:2px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap}
  .due.over{background:var(--bad);border-color:var(--bad);color:#fff}
  .due.soon{background:var(--ink);color:#fff}
  .trk{padding:12px 0;border-top:1px solid var(--soft)}
  .trk:first-of-type{border-top:0}
  .trk .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .trk .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .trk .ins{font-size:14px;color:#333;margin-top:6px;white-space:pre-wrap}
  .bannerlink{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);background:#fff;color:inherit;text-decoration:none;margin-bottom:12px}
  .bannerlink.over{border-color:var(--bad);background:#fff5f5}
  .warn code{background:#fff;padding:1px 5px;border:1px solid #e0b4b4}
  .linkbtn{display:block;text-decoration:none;color:inherit}
  .hide{display:none!important}

  /* ---------- sticker printing ---------- */
  .sticker-only{display:none}
  .sticker{width:var(--sw,1.5in);text-align:center;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;background:#fff}
  .sticker svg{width:100%;height:auto;display:block}
  .sticker .st{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:calc(var(--sw,1.5in)*0.14);letter-spacing:.02em;line-height:1;margin-top:3px}
  .sticker .sn{font-weight:700;font-size:calc(var(--sw,1.5in)*0.08);line-height:1.1;margin-top:2px;word-break:break-word}
  .sticker .sl{font-size:calc(var(--sw,1.5in)*0.07);line-height:1.1}
  @page{margin:0.15in}
  @media print{
    body.print-sticker main>*:not(.sticker-only){display:none!important}
    body.print-sticker .sticker-only{display:block!important}
    header,.noprint,#tabs,#toasts{display:none!important}
    body{background:#fff}
    main{max-width:none;padding:0!important}
    .card{border:0;padding:0}
    #app>*{animation:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<header class="noprint">
  <a class="brand" href="#/" aria-label="Geminus Assets home">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="2" y="2" width="8" height="8"/><rect x="14" y="2" width="8" height="8"/><rect x="2" y="14" width="8" height="8"/><rect x="14" y="14" width="3" height="3"/><rect x="19" y="19" width="3" height="3"/></svg>
    <h1>Geminus</h1>
  </a>
  <select id="wsSelect" class="hide" aria-label="Workspace"></select>
  <a id="wsBtn" class="wsbtn hide" href="#/properties" aria-label="Switch property"></a>
  <a id="profileBtn" class="avatar hide" href="#/profile" aria-label="Your profile">?</a>
</header>
<main id="app"></main>

<nav id="tabs" class="noprint hide" aria-label="Main">

  <a href="#/new"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>New</a>
  <a href="#/labels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2"/></svg>Labels</a>
  <a href="#/setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setup</a>
  <a href="#/team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/></svg>Team</a>
</nav>

<script>
// ====== CONFIG: paste your Supabase project values here ======
const SUPABASE_URL = 'https://yumrglreoawfyvviyxgh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bXJnbHJlb2F3Znl2dml5eGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3NjgxMDIsImV4cCI6MjA2MzM0NDEwMn0.q9Gl79BRgQSzw912C7_3tmmZEtRBMANoi-ALKAk4GxE';
// =============================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const wsSelect = document.getElementById('wsSelect');
const wsBtn = document.getElementById('wsBtn');
const profileBtn = document.getElementById('profileBtn');
const tabs = document.getElementById('tabs');

const S = { user: null, workspaces: [], ws: null, members: {}, components: [], flash: false,
  locations: [], types: [], fields: [], metaError: false, filter: { type: '', loc: '' }, locEdit: null, bulk: null, tasks: [], done: {}, taskError: false };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const PROP_KIND = { hotel: 'Hotel', house: 'House', commercial: 'Commercial', other: 'Other' };
const lastWs = { get: () => { try { return localStorage.getItem('mqr_ws'); } catch { return null; } },
                 set: v => { try { localStorage.setItem('mqr_ws', v); if (v) { const r = lastWs.recent(); r[v] = Date.now(); localStorage.setItem('mqr_recent', JSON.stringify(r)); } } catch {} },

const DAY = 864e5;
// Supabase returns at most 1000 rows per request, so read big tables a page at a time.
async function fetchAll(make) {
  const out = [];
  for (let from = 0; from < 100000; from += 1000) {
    const { data, error } = await make().range(from, from + 999);
    if (error) return { data: null, error };
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return { data: out, error: null };
}
function buildDone(recs) {
  const done = {};
  (recs || []).forEach(x => { const k = x.component_id + '|' + x.task_id; const d = +new Date(x.performed_at); if (!(done[k] >= d)) done[k] = d; });
  return done;
}
async function loadTasks() {
  S.tasks = []; S.done = {}; S.taskError = false;
  if (!S.ws) return;
  const [t, r] = await Promise.all([
    fetchAll(() => sb.from('task_defs_gm').select('*').eq('workspace_id', S.ws.id).order('id')),
    fetchAll(() => sb.from('records').select('id,component_id,task_id,performed_at').eq('workspace_id', S.ws.id).not('task_id', 'is', null).order('id'))
  ]);
  if (t.error || r.error) { S.taskError = true; return; }
  S.tasks = t.data; S.done = buildDone(r.data);
}
// Tasks that apply to one component: type templates (unless overridden/skipped) plus its own.
function tasksFor(c) {
  const over = {}; S.tasks.forEach(t => { if (t.component_id === c.id && t.overrides_id) over[t.overrides_id] = t; });
  const out = [], skipped = [];
  S.tasks.filter(t => t.type_id && t.type_id === c.type_id).forEach(base => {
    const o = over[base.id];
    if (!o) out.push({ eff: base, base, source: 'type' });
    else if (o.disabled) skipped.push({ eff: o, base });
    else out.push({ eff: o, base, source: 'override' });
  });
  S.tasks.filter(t => t.component_id === c.id && !t.overrides_id).forEach(t => out.push({ eff: t, base: null, source: 'own' }));
  return { out, skipped };
}
function taskState(c, row) {
  let last = 0;
  [row.eff.id, row.base?.id].forEach(id => { const d = id && S.done[c.id + '|' + id]; if (d > last) last = d; });
  const start = last || Math.max(+new Date(row.eff.created_at), +new Date(c.created_at));
  const due = start + row.eff.interval_days * DAY;
  return { last, due, days: Math.ceil((due - Date.now()) / DAY) };
}
const dueText = d => d < 0 ? `Overdue ${-d} d` : d === 0 ? 'Due today' : `Due in ${d} d`;
const dueChip = d => `<span class="due ${d < 0 ? 'over' : d <= 7 ? 'soon' : ''}">${dueText(d)}</span>`;
const everyText = n => n % 365 === 0 ? (n === 365 ? 'Every year' : `Every ${n / 365} years`) : n % 30 === 0 ? (n === 30 ? 'Every month' : `Every ${n / 30} months`) : n % 7 === 0 ? (n === 7 ? 'Every week' : `Every ${n / 7} weeks`) : `Every ${n} days`;
function allDue() {

  return rows.sort((a, b) => a.days - b.days);
}

async function openWorkspace(id) {
  const w = S.workspaces.find(x => x.id === id); if (!w) return;
  S.ws = w; lastWs.set(id); await loadMembers(); await loadMeta(); updateTabs();
  if (location.hash === '#/' || location.hash === '') route(); else location.hash = '#/';
}
async function loadPropCounts() {
  const [c, t, r] = await Promise.all([
    fetchAll(() => sb.from('components').select('id,workspace_id,type_id,created_at').order('id')),
    fetchAll(() => sb.from('task_defs_gm').select('*').order('id')),
    fetchAll(() => sb.from('records').select('id,component_id,task_id,performed_at').not('task_id', 'is', null).order('id'))
  ]);
  if (c.error || t.error || r.error) return null;
  S.tasks = t.data; S.done = buildDone(r.data);
  const out = {};
  c.data.forEach(comp => {
    const o = out[comp.workspace_id] ??= { over: 0, soon: 0, total: 0 };
    tasksFor(comp).out.forEach(row => { const d = taskState(comp, row).days; o.total++; if (d < 0) o.over++; else if (d <= 7) o.soon++; });
  });
  return out;
}
async function renderProperties() {
  const f = S.pf ??= { q: '', chip: 'all' };
  app.innerHTML = `<div class="pagehead"><h2>Properties</h2></div>` + skeleton(3);
  const fr = await sb.from('workspace_favs_gm').select('workspace_id');
  const favOK = !fr.error; S.favs = new Set((fr.data || []).map(x => x.workspace_id));
  let counts = null;
  const recent = lastWs.recent();
  app.innerHTML = `
    <div class="pagehead"><h2>Properties</h2><span class="count" id="pcnt"></span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="pq" type="search" placeholder="Search properties…" autocomplete="off" value="${esc(f.q)}"></div>
    <div class="chips" id="pchips" style="margin-bottom:12px"></div>
    <div id="plist"></div>
    <div class="row" style="margin-top:14px"><button class="sec" id="pnew">+ New property / join with code</button></div>`;
  const draw = () => {
    const kinds = [...new Set(S.workspaces.map(w => w.kind).filter(Boolean))];
    const chips = [['all', 'All'], ...(S.favs.size ? [['fav', '★ Favorites']] : []), ...kinds.map(k => [k, PROP_KIND[k]])];
    if (!chips.some(([k]) => k === f.chip)) f.chip = 'all';
    document.getElementById('pchips').innerHTML = chips.length > 1 ? chips.map(([k, l]) => `<button type="button" class="chip" data-c="${k}" aria-pressed="${f.chip === k}">${l}</button>`).join('') : '';
    const q = f.q.trim().toLowerCase();
    const rows = S.workspaces.filter(w => (f.chip === 'all' || (f.chip === 'fav' ? S.favs.has(w.id) : w.kind === f.chip)) && (!q || w.name.toLowerCase().includes(q) || (PROP_KIND[w.kind] || '').toLowerCase().includes(q)))
      .sort((a, b) => (S.favs.has(b.id) - S.favs.has(a.id)) || ((recent[b.id] || 0) - (recent[a.id] || 0)) || a.name.localeCompare(b.name));
    document.getElementById('pcnt').textContent = rows.length + (rows.length === 1 ? ' property' : ' properties');
    document.getElementById('plist').innerHTML = rows.map((w, i) => {
      const c = counts?.[w.id];
      const chip = !counts ? '' : c?.over ? `<span class="due over">${c.over} overdue</span>` : c?.soon ? `<span class="due soon">${c.soon} due this week</span>` : c?.total ? '<span class="due">On track</span>' : '';
      return `<div class="item" data-open="${w.id}" role="button" tabindex="0" style="animation-delay:${Math.min(i, 8) * 40}ms">
        <div class="t"><b>${esc(w.name)}</b><span class="mut">${w.kind ? `<span class="tag">${PROP_KIND[w.kind]}</span>` : ''}${S.ws && w.id === S.ws.id ? '<span class="tag line">Current</span>' : ''}</span></div>
        ${chip}<button class="star" data-fav="${w.id}" aria-pressed="${S.favs.has(w.id)}" aria-label="Favorite">${S.favs.has(w.id) ? '★' : '☆'}</button></div>`;
    }).join('') || '<div class="card mut" style="text-align:center">No properties match.</div>';
  };
  draw();
  document.getElementById('pq').oninput = e => { f.q = e.target.value; draw(); };
  document.getElementById('pchips').onclick = e => { const b = e.target.closest('.chip'); if (b) { f.chip = b.dataset.c; draw(); } };
  document.getElementById('plist').onclick = async e => {
    const st = e.target.closest('[data-fav]');
    if (st) {
      e.stopPropagation(); const id = st.dataset.fav, on = S.favs.has(id);
      const { error } = on ? await sb.from('workspace_favs_gm').delete().eq('workspace_id', id)
                           : await sb.from('workspace_favs_gm').insert({ workspace_id: id });
      if (error) return toast(favOK ? friendlyErr(error.message) : 'Run properties.sql in Supabase to use favorites.', true);
      on ? S.favs.delete(id) : S.favs.add(id); draw(); return;
    }
    const it = e.target.closest('[data-open]'); if (it) openWorkspace(it.dataset.open);
  };
  document.getElementById('plist').onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.open) openWorkspace(e.target.dataset.open); };
  document.getElementById('pnew').onclick = () => renderWorkspaceSetup(true);
  counts = await loadPropCounts();
  if (counts && location.hash === '#/properties' && document.getElementById('plist')) draw();
}

  app.innerHTML = `
    <div class="card"><h2>Create a workspace</h2>
      <p class="mut">A workspace is one team (e.g. your employer). Everyone in it shares components and records.</p>

    <div class="card"><h2>Or join one</h2>

      <div class="err" id="err2"></div>
      <button id="jn">Join</button></div>
    ${canCancel ? '<button class="sec" id="cx">Cancel</button>' : ''}`;

  document.getElementById('mk').onclick = ev => busy(ev.currentTarget, async () => {

  document.getElementById('jn').onclick = ev => busy(ev.currentTarget, async () => {

}

  S.components = data;
  if (!data.length) {
    app.innerHTML = `
      <div class="pagehead"><h2>Assets</h2></div>
      ${migrationBanner()}
      <div class="card empty">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2"/></svg>
        <h2>No components yet</h2>
        <p>Add your first piece of equipment, then print its QR sticker.</p>
        <button onclick="location.hash='#/new'">Add component</button>
      </div>`;
    return;
  }
  const showFilters = S.types.length || S.locations.length;
  await loadTasks();
  const dueRows = S.taskError ? [] : allDue();
  const nOver = dueRows.filter(x => x.days < 0).length, nSoon = dueRows.filter(x => x.days >= 0 && x.days <= 7).length;
  app.innerHTML = `
    <div class="pagehead"><h2>Assets</h2><span class="count" id="cnt"></span></div>
    ${migrationBanner()}
    ${nOver || nSoon ? `<a class="bannerlink ${nOver ? 'over' : ''}" href="#/due"><span><b>${nOver} overdue</b> · ${nSoon} due this week</span><span>→</span></a>` : ''}
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search components…" autocomplete="off"></div>
    ${showFilters ? `<div class="filters">
      <select id="ft" aria-label="Filter by type">${typeOptions(S.filter.type, 'All types')}</select>
      <select id="fl" aria-label="Filter by location">${locOptions(S.filter.loc, 'All locations')}</select></div>` : ''}
    <div id="list"></div>`;
  const draw = () => {
    const q = document.getElementById('q').value.toLowerCase();
    const locSet = S.filter.loc ? locAndDesc(S.filter.loc) : null;
    const rows = S.components.filter(c => {
      if (S.filter.type && c.type_id !== S.filter.type) return false;
      if (locSet && !locSet.has(c.location_id)) return false;
      const tn = c.type_id ? typeById(c.type_id)?.name : c.category;
      const lp = c.location_id ? locPath(c.location_id) : c.location;
      return [c.name, c.tag, tn, lp].join(' ').toLowerCase().includes(q);
    });
    document.getElementById('cnt').textContent = rows.length + (rows.length === 1 ? ' component' : ' components');
    document.getElementById('list').innerHTML = rows.length ? rows.map((c, i) => {
      const tn = c.type_id ? typeById(c.type_id)?.name : c.category;
      const lp = c.location_id ? locPath(c.location_id) : (c.location || '');
      return `
      <a class="item" href="#/c/${c.id}" style="animation-delay:${Math.min(i, 8) * 40}ms">
        <div class="t"><b>${esc(c.name)}</b>
          <span class="mut">${c.tag ? `<span class="tag line" style="font-weight:700">${esc(c.tag)}</span>` : ''}${tn ? `<span class="tag">${esc(tn)}</span>` : ''}${esc(lp)}</span></div>
        <span class="arrow">→</span></a>`;
    }).join('') : '<div class="card mut" style="text-align:center">Nothing matches.</div>';
  };
  document.getElementById('q').oninput = draw;
  const ft = document.getElementById('ft'), fl = document.getElementById('fl');
  if (ft) ft.onchange = () => { S.filter.type = ft.value; draw(); };
  if (fl) fl.onchange = () => { S.filter.loc = fl.value; draw(); };
  draw();
}

// ---------- New / edit component ----------
function renderNew() { renderComponentForm(null); }
function renderComponentForm(c, seed) {
  const editing = !!c;
  const last = !editing && !seed ? newDefaults.get() : null;     // new component: start from what you used last time
  const dkey = 'mqr_draft_' + S.ws.id + '_' + (editing ? c.id : 'new');
  const dr = !seed ? drafts.get(dkey) : null;                    // half-filled form from before the app was interrupted
  let typeId = dr ? (typeById(dr.type) ? dr.type : '') : (c?.type_id || seed?.type_id || (last && typeById(last.type) ? last.type : ''));
  let locId = dr ? (locById(dr.loc) ? dr.loc : '') : (c?.location_id || seed?.location_id || (last && locById(last.loc) ? last.loc : ''));
  const custom = { ...(dr ? dr.custom : (c?.custom || seed?.custom || {})) };
  app.innerHTML = `
    <div class="pagehead"><h2>${editing ? 'Edit component' : seed ? 'Add another' : 'New component'}</h2></div>
    ${migrationBanner()}
    ${dr ? '<div class="card" id="drbanner" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>Restored your unsaved entry.</span><button class="sec sm" id="drdiscard" type="button">Discard</button></div>' : ''}
    <div class="card">
      ${editing && c.tag ? `<p class="mut" style="margin:0 0 4px">Asset tag: <b>${esc(c.tag)}</b></p>` : ''}
      <label for="n" id="nlabel">Name *</label><input id="n" value="${esc(dr ? dr.name : (c?.name || (seed && !seed.type_id ? seed.name : '')))}" placeholder="e.g. Rooftop AC Unit 2" autocomplete="off">

      <label for="ty">Type</label>
      <div class="row"><select id="ty">${typeOptions(typeId)}</select><button type="button" class="sec sm" id="addty">+ Type</button></div>
      <div id="qty"></div>
      <div id="cf"></div>
      <div id="afhost"></div>
      <div id="afbtn"></div>

      <label for="lo">Location</label>
      <div class="row"><select id="lo">${locOptions(locId)}</select><button type="button" class="sec sm" id="addlo">+ Location</button></div>
      <div id="qlo"></div>

      ${editing ? '' : `<div id="qtywrap" class="hide"><label for="qn">How many?</label>
        <div class="stepper"><button type="button" class="sec" id="qminus" aria-label="Fewer">−</button>
          <input id="qn" type="number" min="1" max="50" value="1" inputmode="numeric"><button type="button" class="sec" id="qplus" aria-label="More">+</button></div>
        <p class="mut" id="qnhint" style="margin:6px 0 0"></p></div>`}

      <label for="nt">Notes</label><textarea id="nt" placeholder="Model, serial number, anything useful">${esc(dr ? dr.notes : (c?.notes || ''))}</textarea>
      <div class="err" id="err"></div>
      <div class="row"><button id="save">${editing ? 'Save' : 'Save component'}</button>${editing ? '<button class="sec" id="cx">Cancel</button>' : ''}</div>
    </div>`;
  const $ = id => document.getElementById(id);

  // read whatever is typed into the field inputs into `custom`
  const syncCustom = () => $('cf').querySelectorAll('[data-f]').forEach(el => {
    const id = el.dataset.f, k = el.dataset.k; let v = el.value;
    if (v === '') { delete custom[id]; return; }
    custom[id] = k === 'number' ? Number(v) : k === 'bool' ? v === 'true' : v;
  });
  const drawCF = () => {
    syncCustom();
    const defs = S.fields.filter(f => f.type_id === typeId);
    $('cf').innerHTML = !typeId ? '' : defs.length
      ? defs.map(f => `<label>${esc(f.label)}${f.kind === 'number' && f.unit ? ` (${esc(f.unit)})` : ''}</label>${fieldInput(f, custom[f.id])}`).join('')
      : '<p class="mut">This type has no fields yet.</p>';
    $('afbtn').innerHTML = typeId ? '<button type="button" class="sec sm" id="addfield" style="margin-top:12px">+ Add field</button>' : '';
    const b = $('addfield');
    if (b) b.onclick = () => openFieldForm($('afhost'), typeId, null, drawCF);
  };
  // name becomes optional once a type is chosen; "how many" appears for new components
  const syncHints = () => {
    const tn = typeId ? typeById(typeId)?.name : '';
    $('nlabel').textContent = tn && !editing ? 'Name (optional)' : 'Name *';
    $('n').placeholder = tn && !editing ? `Leave blank to use "${tn} 001"` : 'e.g. Rooftop AC Unit 2';
    if (!editing) {
      $('qtywrap').classList.toggle('hide', !typeId);
      const q = Math.max(1, Math.min(50, parseInt($('qn').value, 10) || 1));
      $('qnhint').textContent = !typeId ? '' : q > 1
        ? `Creates ${q} components with numbered tags. You can set each one's room afterwards.`
        : 'Each component gets its own asset tag and QR code.';
    }
  };
  drawCF(); syncHints();
  if (dr && !editing && dr.qty) $('qn').value = dr.qty;
  if (dr) { syncHints(); $('drdiscard').onclick = () => { drafts.del(dkey); editing ? renderComponentForm(c) : renderComponentForm(null); }; }
  let dt = 0;
  const keep = () => { clearTimeout(dt); dt = setTimeout(() => { if (!document.getElementById('cf')) return; syncCustom(); drafts.set(dkey, { name: $('n').value, notes: $('nt').value, type: typeId, loc: locId, custom, qty: $('qn') ? $('qn').value : '1' }); }, 250); };
  if (!seed) { const card = app.querySelector('.card:not(#drbanner)'); card.addEventListener('input', keep); card.addEventListener('change', keep); card.addEventListener('click', e => { if (e.target.closest('#qminus,#qplus')) keep(); }); }
  if (!editing) {
    $('qn').oninput = syncHints;
    const bump = d => { $('qn').value = Math.max(1, Math.min(50, (parseInt($('qn').value, 10) || 1) + d)); syncHints(); };
    $('qminus').onclick = () => bump(-1); $('qplus').onclick = () => bump(1);
  }
  $('ty').onchange = () => { syncCustom(); typeId = $('ty').value; $('afhost').innerHTML = ''; drawCF(); syncHints(); };
  $('lo').onchange = () => { locId = $('lo').value; };

  $('addty').onclick = () => {
    $('qty').innerHTML = `<div class="panel"><label for="qtn">New type name</label><input id="qtn" placeholder="e.g. Boiler, Pump, Fire extinguisher">
      <div class="err" id="qterr"></div><div class="row"><button id="qtsave">Add type</button><button class="sec" id="qtcancel">Cancel</button></div></div>`;
    $('qtcancel').onclick = () => { $('qty').innerHTML = ''; };
    onEnter('qtn', 'qtsave');
    $('qtsave').onclick = ev => busy(ev.currentTarget, async () => {
      const name = $('qtn').value.trim(); if (!name) return setErr('Enter a name', 'qterr');
      const { data, error } = await sb.from('component_types').insert({ workspace_id: S.ws.id, name }).select().single();
      if (error) return setErr(error.message, 'qterr');
      await loadMeta(); syncCustom(); typeId = data.id;
      $('ty').innerHTML = typeOptions(typeId); $('qty').innerHTML = ''; toast('Type added'); drawCF(); syncHints();
    });
  };
  $('addlo').onclick = () => {
    $('qlo').innerHTML = `<div class="panel"><label for="qln">New location name</label><input id="qln" placeholder="e.g. Boiler room">
      <label for="qlp">Inside</label><select id="qlp">${locOptions(locId, '— top level —')}</select>
      <div class="err" id="qlerr"></div><div class="row"><button id="qlsave">Add location</button><button class="sec" id="qlcancel">Cancel</button></div></div>`;
    $('qlcancel').onclick = () => { $('qlo').innerHTML = ''; };
    onEnter('qln', 'qlsave');
    $('qlsave').onclick = ev => busy(ev.currentTarget, async () => {
      const name = $('qln').value.trim(); if (!name) return setErr('Enter a name', 'qlerr');
      const { data, error } = await sb.from('locations').insert({ workspace_id: S.ws.id, name, parent_id: $('qlp').value || null }).select().single();
      if (error) return setErr(error.message, 'qlerr');
      await loadMeta(); locId = data.id;
      $('lo').innerHTML = locOptions(locId); $('qlo').innerHTML = ''; toast('Location added');
    });
  };

  if (editing) $('cx').onclick = () => { drafts.del(dkey); renderComponent(c.id); };
  else $('n').focus({ preventScroll: true });
  $('save').onclick = ev => busy(ev.currentTarget, async () => {
    clearTimeout(dt);
    const name = $('n').value.trim();
    const typeName = typeId ? (typeById(typeId)?.name || '') : '';
    if (!name && (editing || !typeName)) return setErr('Name is required');
    setErr('');
    syncCustom();
    const base = { type_id: typeId || null, location_id: locId || null, custom, notes: $('nt').value.trim() || null };
    if (editing) {
      const row = { ...base, name };
      const typeChanged = typeId && typeId !== c.type_id;
      if (typeId && (!c.tag || typeChanged)) {   // first tag, or a new type means a new tag from that type's numbering
        if (c.tag && typeChanged && !confirm(`Changing the type gives this asset a new tag (now ${c.tag}). The QR code keeps working; a printed sticker will still show the old tag until you reprint it. Continue?`)) return;
        const { data: tg, error: te } = await sb.rpc('allocate_tags', { p_type_id: typeId, p_count: 1 });
        if (te) return setErr(te.message);
        row.tag = tg[0];
        const oldNum = c.tag ? c.tag.split('-').pop() : '', newNum = tg[0].split('-').pop();
        if (oldNum && row.name.endsWith(' ' + oldNum)) row.name = row.name.slice(0, -oldNum.length) + newNum;   // keep "Name 013" in step with its tag
      }
      const { error } = await sb.from('components').update(row).eq('id', c.id);
      if (error) return setErr(error.message);
      drafts.del(dkey); await loadMeta(); toast('Saved'); renderComponent(c.id);
      return;
    }
    const qty = typeId ? Math.max(1, Math.min(50, parseInt($('qn').value, 10) || 1)) : 1;
    let tags = [];
    if (typeId) {
      const { data: tg, error: te } = await sb.rpc('allocate_tags', { p_type_id: typeId, p_count: qty });
      if (te) return setErr(te.message);
      tags = tg;
    }
    const rows = Array.from({ length: qty }, (_, i) => {
      const tag = tags[i] || null, num = tag ? tag.split('-').pop() : '';
      const nm = name ? ((qty > 1 || (tag && !/\d$/.test(name))) ? `${name} ${num}` : name) : `${typeName} ${num}`;
      return { ...base, name: nm, tag, workspace_id: S.ws.id };
    });
    const { data, error } = await sb.from('components').insert(rows).select();
    if (error) return setErr(error.message);
    await loadMeta();
    drafts.del(dkey); newDefaults.set({ type: typeId, loc: locId });
    if (data.length === 1) {
      location.hash = '#/c/' + data[0].id;
      toastAction('Component created', [{ label: '+ Another', fn: () => renderComponentForm(null, data[0]) }]);
    }
    else { S.batchRows = data; toast(`${data.length} components created`); location.hash = '#/batch'; }
  });
}

// ---------- Component detail ----------
const REC_TYPES = ['Service', 'Inspection', 'Repair', 'Replacement', 'Cleaning', 'Other'];
async function renderDue() {
  app.innerHTML = `<div class="pagehead"><h2>Due</h2><a class="count" href="#/">← Assets</a></div>` + skeleton(3);
  const { data, error } = await sb.from('components').select('*').eq('workspace_id', S.ws.id).order('name');
  if (error) { app.innerHTML = `<div class="card"><div class="err">${esc(friendlyErr(error.message))}</div></div>`; return; }
  S.components = data; await loadTasks();
  if (S.taskError) { app.innerHTML = `<div class="pagehead"><h2>Due</h2></div><div class="card warn"><h2>One setup step left</h2><p>In Supabase, open <b>SQL Editor</b>, paste <code>tasks.sql</code> and run it once. Then reload.</p></div>`; return; }
  const rows = allDue();
  const groups = [['Overdue', x => x.days < 0], ['This week', x => x.days >= 0 && x.days <= 7], ['Next 30 days', x => x.days > 7 && x.days <= 30]];
  const item = x => { const lp = x.c.location_id ? locPath(x.c.location_id) : ''; return `<a class="item" href="#/c/${x.c.id}">
    <div class="t"><b>${esc(x.r.eff.title)}</b><span class="mut">${x.c.tag ? `<span class="tag line" style="font-weight:700">${esc(x.c.tag)}</span>` : ''}${esc(x.c.name)}${lp ? ' · ' + esc(lp) : ''}</span></div>${dueChip(x.days)}</a>`; };
  const later = rows.filter(x => x.days > 30).length;
  app.innerHTML = `<div class="pagehead"><h2>Due</h2><a class="count" href="#/">← Assets</a></div>
    ${rows.length ? '' : '<div class="card empty"><h2>No recurring tasks yet</h2><p>Open a component type in Setup and add a recurring task, like “Inspect every 90 days”. It will show up here.</p><button onclick="location.hash=\'#/setup\'">Go to Setup</button></div>'}
    ${groups.map(([label, f]) => { const g = rows.filter(f); return g.length ? `<h3 style="margin:18px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase">${label} (${g.length})</h3>${g.map(item).join('')}` : ''; }).join('')}
    ${rows.length && !rows.some(x => x.days <= 30) ? '<div class="card mut" style="text-align:center">Nothing due in the next 30 days.</div>' : ''}
    ${later ? `<p class="mut" style="text-align:center">${later} more task${later === 1 ? '' : 's'} due later than 30 days.</p>` : ''}`;
}

async function renderComponent(id, afterJoin = false) {
  document.body.classList.remove('sheet-open');
  app.innerHTML = skeleton(3);
  const { data: c, error } = await sb.from('components').select('*').eq('id', id).maybeSingle();
  if (error || !c) return renderJoinPrompt(id, afterJoin ? 'That join code is for a different workspace than this component.' : '');
  // switch workspace automatically if the scanned QR belongs to another one
  if (c.workspace_id !== S.ws.id) {
    S.ws = S.workspaces.find(w => w.id === c.workspace_id) || S.ws;
    wsSelect.value = S.ws.id; lastWs.set(S.ws.id); await loadMembers(); await loadMeta();
  }
  updateTabs();
  document.body.classList.add('has-logbar');
  const { data: recs } = await sb.from('records').select('*').eq('component_id', id).order('performed_at', { ascending: false });
  await loadTasks();
  const tk = S.taskError ? { out: [], skipped: [] } : tasksFor(c);
  const isOwner = canManage();
  let recType = 'Service', logTask = null;
  const tName = c.type_id ? typeById(c.type_id)?.name : c.category;
  const lPath = c.location_id ? locPath(c.location_id) : (c.location || '');
  const defs = c.type_id ? S.fields.filter(f => f.type_id === c.type_id) : [];
  app.innerHTML = `
    <div class="card">
      <h2 class="big">${esc(c.name)}</h2>
      <div class="mut">${c.tag ? `<span class="tag line" style="font-weight:700">${esc(c.tag)}</span>` : ''}${tName ? `<span class="tag">${esc(tName)}</span>` : ''}${esc(lPath)}</div>
      ${defs.length ? `<div class="kvs">${defs.map(f => `<div class="kv"><span>${esc(f.label)}</span><b>${esc(fmtField(f, c.custom?.[f.id]))}</b></div>`).join('')}</div>` : ''}
      ${c.notes ? `<p>${esc(c.notes).replace(/\n/g, '<br>')}</p>` : ''}
    </div>
    <div class="card noprint"><h2>Schedule</h2>
      ${S.taskError ? '<p class="mut">Recurring tasks need one database step: run <code>tasks.sql</code> in Supabase, then reload.</p>' : ''}
      ${tk.out.map((r, i) => { const st = taskState(c, r); return `<div class="trk">
        <div class="top"><b>${esc(r.eff.title)}</b>${dueChip(st.days)}</div>
        <div class="mut">${everyText(r.eff.interval_days)} · ${st.last ? 'last done ' + fmt(new Date(st.last).toISOString()) : 'never logged'}${r.source === 'override' ? ' · custom for this asset' : ''}</div>
        ${r.eff.instructions ? `<div class="ins">${esc(r.eff.instructions)}</div>` : ''}
        <div class="acts"><button class="sm" data-done="${i}">✓ Done</button><button class="sec sm" data-log="${i}">With note</button>
          ${r.source === 'type' ? `<button class="sec sm" data-cust="${i}">Customize</button><button class="sec sm" data-skip="${i}">Skip here</button>` : ''}
          ${r.source === 'override' ? `<button class="sec sm" data-tedit="${i}">Edit</button><button class="sec sm" data-treset="${r.eff.id}">Use type default</button>` : ''}
          ${r.source === 'own' ? `<button class="sec sm" data-tedit="${i}">Edit</button><button class="sec sm" data-treset="${r.eff.id}">Delete</button>` : ''}</div>
        <div data-thost="${i}"></div></div>`; }).join('') || (S.taskError ? '' : '<div class="mut">No recurring tasks yet.</div>')}
      ${tk.skipped.map(x => `<div class="mut" style="margin-top:8px">Skipped here: ${esc(x.base.title)} <button class="sec sm" data-treset="${x.eff.id}">Restore</button></div>`).join('')}
      <div id="newtask"></div>
      ${S.taskError ? '' : '<button class="sec" id="addtask" style="margin-top:12px">+ Add task for this asset</button>'}
    </div>
    <div class="card">
      <div class="qrframe"><div class="qr">${qrSvg(compUrl(c.id))}</div></div>
      <div class="qrcap">Scan to log maintenance</div>
      <div class="row actions noprint">
        <select id="ssize" aria-label="Sticker size">
          <option value="1in">Sticker 1 in</option>
          <option value="1.5in" selected>Sticker 1.5 in</option>
          <option value="2in">Sticker 2 in</option>
        </select>
        <button id="psticker">Print sticker</button>
        <button class="sec" onclick="window.print()">Full page</button>
        <button class="sec" id="edit">Edit</button>
        <button class="sec" id="clone">Add another like this</button>
        ${isOwner ? '<button class="bad" id="del">Delete</button>' : ''}
      </div>
    </div>
    <div class="sheetbg noprint" id="sbg"></div>
    <div class="sheet noprint" id="sheet" role="dialog" aria-label="Log maintenance">
      <div class="sheethead"><h2 style="margin:0" id="sheettitle">Log maintenance</h2><button class="sec sm" id="closesheet" type="button" aria-label="Close">✕</button></div>
      <div id="logfor"></div>
      <div id="typewrap"><label>Type</label>
        <div class="chips" id="chips">${REC_TYPES.map(t => `<button type="button" class="chip" aria-pressed="${t === 'Service'}" data-t="${t}">${t}</button>`).join('')}</div></div>
      <label for="rd" id="rdlabel">What was done *</label>
      <div class="chips" id="qchips" style="margin-bottom:8px">${quickNotes(c.type_id).map(q => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <textarea id="rd" placeholder="Describe the work, parts used, readings…">${esc(drafts.get('mqr_draftlog_' + id)?.text || '')}</textarea>
      <div class="err" id="err"></div>
      <button id="addrec" class="big">Save record</button>
    </div>
    <div class="logbar noprint"><button id="openlog" type="button">＋ Log maintenance${drafts.get('mqr_draftlog_' + id) ? ' · unsaved text' : ''}</button></div>
    <div class="card"><h2>History (${(recs || []).length})</h2>
      <div class="tl">
      ${(recs || []).map(r => `
        <div class="rec"><span class="tag">${esc(r.type)}</span>
          <span class="mut meta">${fmt(r.performed_at)} · ${esc(S.members[r.performed_by]?.display_name || r.author_name || 'former member')}</span>
          <div>${esc(r.description).replace(/\n/g, '<br>')}</div>
          ${(r.performed_by === S.user.id || isOwner) ? `<button class="sec sm noprint" data-del="${r.id}" style="margin-top:8px">Delete</button>` : ''}
        </div>`).join('') || '<div class="mut">No records yet. Log the first one above.</div>'}
      </div>
    </div>`;
  if (S.flash) { app.querySelector('.rec')?.classList.add('flash'); S.flash = false; }

  // sticker print block
  const st = document.createElement('div');
  st.className = 'sticker-only';
  st.innerHTML = `<div class="sticker">${qrSvg(compUrl(c.id))}${c.tag ? `<div class="st">${esc(c.tag)}</div>` : ''}<div class="sn">${esc(c.name)}</div>${lPath ? `<div class="sl">${esc(lPath)}</div>` : ''}</div>`;
  app.appendChild(st);
  document.getElementById('psticker').onclick = () => {
    st.style.setProperty('--sw', document.getElementById('ssize').value);
    document.body.classList.add('print-sticker');
    window.print();
  };

  const setRecType = t => { recType = t; document.querySelectorAll('#chips .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === t)); };
  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    setRecType(b.dataset.t);
  });
  // "Add note" after a one-tap Done: the sheet adds a note to that record instead of making a new one
  let noteMode = null;
  if (S.noteFor && S.noteFor.cid === id) {
    noteMode = S.noteFor; S.noteFor = null;
    document.getElementById('sheettitle').textContent = 'Add a note';
    document.getElementById('typewrap').classList.add('hide');
    document.getElementById('rdlabel').textContent = 'Note for: ' + noteMode.title;
    document.getElementById('rd').placeholder = 'Parts used, readings, anything to remember…';
    document.getElementById('addrec').textContent = 'Save note';
    document.body.classList.add('sheet-open'); setTimeout(() => document.getElementById('rd').focus(), 80);
  }
  document.getElementById('addrec').onclick = ev => busy(ev.currentTarget, async () => {
    const typed = document.getElementById('rd').value.trim();
    const description = typed || (!noteMode && logTask ? logTask.eff.title : '');
    if (!description) return setErr(noteMode ? 'Write a note' : 'Describe what was done');
    if (noteMode) {
      const { error: ne } = await sb.from('records').update({ description: noteMode.title + ' — ' + description }).eq('id', noteMode.rid);
      if (ne) return setErr(ne.message);
      drafts.del('mqr_draftlog_' + id); S.flash = true; toast('Note added'); return renderComponent(id);
    }
    const { error } = await sb.from('records').insert({
      component_id: c.id, workspace_id: c.workspace_id, type: recType, description, ...(logTask ? { task_id: logTask.eff.id } : {}) });
    if (error) return setErr(error.message);
    drafts.del('mqr_draftlog_' + id); S.flash = true; toast('Record added'); renderComponent(id);
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Delete this record?')) return;
    busy(b, async () => {
      const { error } = await sb.from('records').delete().eq('id', b.dataset.del);
      if (error) return toast(friendlyErr(error.message), true);
      toast('Record deleted'); renderComponent(id);
    });
  });
  document.getElementById('edit').onclick = () => renderEdit(c);
  document.getElementById('clone').onclick = () => renderComponentForm(null, c);
  const redoC = () => renderComponent(id);
  const showLogFor = () => {
    const el = document.getElementById('logfor');
    el.innerHTML = logTask ? `<div class="panel" style="margin-top:0"><b>Completing: ${esc(logTask.eff.title)}</b> <button class="sec sm" id="unlog" type="button" style="float:right">✕</button>${logTask.eff.instructions ? `<div class="ins" style="font-size:14px;white-space:pre-wrap;margin-top:6px">${esc(logTask.eff.instructions)}</div>` : ''}</div>` : '';
    const u = document.getElementById('unlog'); if (u) u.onclick = () => { logTask = null; showLogFor(); };
  };
  const openSheet = () => { document.body.classList.add('sheet-open'); setTimeout(() => document.getElementById('rd').focus(), 80); };
  const closeSheet = () => { document.body.classList.remove('sheet-open'); };
  document.getElementById('openlog').onclick = openSheet;
  document.getElementById('rd').addEventListener('input', e => { const v = e.target.value; v.trim() ? drafts.set('mqr_draftlog_' + id, { text: v }) : drafts.del('mqr_draftlog_' + id); });
  document.getElementById('closesheet').onclick = closeSheet;
  document.getElementById('sbg').onclick = closeSheet;
  document.getElementById('qchips').onclick = e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    const rd = document.getElementById('rd'), cur = rd.value.trim().replace(/[,;.]$/, '');
    rd.value = cur ? cur + ', ' + b.dataset.q.toLowerCase() : b.dataset.q; rd.focus();
  };
  app.querySelectorAll('[data-log]').forEach(b => b.onclick = () => {
    logTask = tk.out[+b.dataset.log]; showLogFor(); setRecType(guessType(logTask.eff.title));
    openSheet();
  });
  app.querySelectorAll('[data-done]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = tk.out[+b.dataset.done], title = r.eff.title;
    const { data, error } = await sb.from('records').insert({ component_id: c.id, workspace_id: c.workspace_id, type: guessType(title), description: title, task_id: r.eff.id }).select('id').single();
    if (error) return toast(friendlyErr(error.message), true);
    S.flash = true; await renderComponent(id);
    toastAction('Done: ' + title, [
      { label: 'Undo', fn: async () => { await sb.from('records').delete().eq('id', data.id); toast('Undone'); renderComponent(id); } },
      { label: 'Add note', fn: () => { S.noteFor = { cid: id, rid: data.id, title }; renderComponent(id); } }]);
  }));
  app.querySelectorAll('[data-cust]').forEach(b => b.onclick = () => { const r = tk.out[+b.dataset.cust];
    openTaskForm(app.querySelector(`[data-thost="${b.dataset.cust}"]`), { component_id: c.id }, null, redoC, r.base); });
  app.querySelectorAll('[data-tedit]').forEach(b => b.onclick = () => { const r = tk.out[+b.dataset.tedit];
    openTaskForm(app.querySelector(`[data-thost="${b.dataset.tedit}"]`), { component_id: c.id }, r.eff, redoC); });
  app.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = tk.out[+b.dataset.skip];
    const { error } = await sb.from('task_defs_gm').insert({ workspace_id: c.workspace_id, component_id: c.id, overrides_id: r.base.id, title: r.base.title, interval_days: r.base.interval_days, disabled: true });
    if (error) return toast(friendlyErr(error.message), true);
    toast('Skipped for this asset'); redoC();
  }));
  app.querySelectorAll('[data-treset]').forEach(b => b.onclick = () => {
    if (b.textContent === 'Delete' && !confirm('Delete this task? Records already logged stay.')) return;
    busy(b, async () => {
      const { error } = await sb.from('task_defs_gm').delete().eq('id', b.dataset.treset);
      if (error) return toast(friendlyErr(error.message), true);
      toast('Done'); redoC();
    });
  });
  const at = document.getElementById('addtask');
  if (at) at.onclick = () => openTaskForm(document.getElementById('newtask'), { component_id: c.id }, null, redoC);
  const del = document.getElementById('del');
  if (del) del.onclick = () => {
    if (!confirm('Delete this component and ALL its records?')) return;
    busy(del, async () => {
      const { error } = await sb.from('components').delete().eq('id', c.id);
      if (error) return toast(friendlyErr(error.message), true);
      toast('Component deleted'); location.hash = '#/';
    });
  };
}

async function renderInvite(code) {
  app.innerHTML = skeleton(2);
  const mine = S.workspaces.find(w => String(w.join_code).toLowerCase() === code.toLowerCase());
  if (mine) {                                   // already a member: just open it
    S.ws = mine; lastWs.set(mine.id); await loadWorkspaces(); toast('You are already in ' + mine.name);
    location.hash = '#/'; return;
  }
  const { data: name, error } = await sb.rpc('workspace_name_for_code', { p_code: code });
  if (error) { app.innerHTML = `<div class="card"><div class="err">${esc(friendlyErr(error.message))}</div></div>`; return; }
  if (!name) {
    app.innerHTML = `<div class="card"><h2>This invite isn't valid</h2>
      <p>The link may have been replaced by a newer one. Ask the person who invited you for a fresh link.</p>
      <div class="row"><button id="home">Continue</button></div></div>`;
    document.getElementById('home').onclick = () => { location.hash = '#/'; };
    return;
  }
  app.innerHTML = `<div class="card">
    <h2 class="big">Join ${esc(name)}?</h2>
    <p>You've been invited to <b>${esc(name)}</b> on Geminus Assets. You'll join as a Member and can see its components and maintenance records.</p>
    <div class="err" id="err"></div>
    <div class="row"><button id="jn">Join workspace</button><button class="sec" id="home">Not now</button></div></div>`;
  document.getElementById('home').onclick = () => { location.hash = '#/'; };
  document.getElementById('jn').onclick = ev => busy(ev.currentTarget, async () => {
    const { data, error: e2 } = await sb.rpc('join_workspace', { p_code: code });
    if (e2) return setErr(e2.message);
    lastWs.set(data); await loadWorkspaces(); toast('Joined ' + name); location.hash = '#/'; route();
  });
}

function renderJoinPrompt(id, msg) {
  app.innerHTML = `
    <div class="card">
      <h2>You are not part of this workspace</h2>
      <p>Please enter the join code to join this workspace and open this component.</p>
      <p class="mut">Ask a teammate for the code. If this component was deleted, the code won't help.</p>
      <label for="jc">Join code</label>
      <input id="jc" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="err" id="err">${esc(msg)}</div>
      <div class="row">
        <button id="jn">Join workspace</button>
        <button class="sec" id="home">Back</button>
      </div>
    </div>`;
  onEnter('jc', 'jn');
  document.getElementById('home').onclick = () => { location.hash = '#/'; };
  document.getElementById('jn').onclick = ev => busy(ev.currentTarget, async () => {
    const code = document.getElementById('jc').value.trim();
    if (!code) return setErr('Enter the join code');
    setErr('');
    const { error } = await sb.rpc('join_workspace', { p_code: code });
    if (error) return setErr(error.message);
    await loadWorkspaces();
    renderComponent(id, true);
  });
}

  const excl = ed?.id ? locAndDesc(ed.id) : new Set();
  app.innerHTML = `
    <div class="pagehead"><h2>Setup</h2><span class="count">${esc(S.ws.name)}</span></div>
    ${migrationBanner()}
    <div class="card"><h2>Component types</h2>

      ${S.types.map(t => `<a class="trow linkbtn" href="#/type/${t.id}"><span class="nm"><b>${esc(t.name)}</b> <span class="mut">${t.prefix ? esc(t.prefix) + ' · ' : ''}${S.fields.filter(f => f.type_id === t.id).length} fields</span></span><span>→</span></a>`).join('') || '<div class="mut">No types yet.</div>'}

      <div class="err" id="terr"></div>
    </div>
    <div class="card"><h2>Locations</h2>
      <p class="mut">Buildings, floors, rooms. Put a location inside another to build a tree.</p>
      ${ed ? `<div class="panel">
        <label for="ln">${ed.id ? 'Rename / move location' : 'New location'}</label>
        <input id="ln" value="${esc(ed.id ? locById(ed.id)?.name : '')}" placeholder="e.g. Building A, Floor 2, Boiler room" autocomplete="off">
        <label for="lp">Inside</label><select id="lp">${locOptions(ed.parent_id, '— top level —', excl)}</select>
        <label for="lk">Kind</label><select id="lk">${kindOptions(ed.id ? locById(ed.id)?.kind : ed.kind)}</select>
        ${ed.id ? `<label for="lg">IFC GlobalId</label><input id="lg" value="${esc(locById(ed.id)?.ifc_guid || '')}" autocomplete="off" spellcheck="false" style="font-family:ui-monospace,monospace;font-size:13px">
        <p class="mut" style="margin:4px 0 0">Created automatically. Paste a room's GlobalId from your IFC model here to link them.</p>` : ''}
        <div class="err" id="lerr"></div>
        <div class="row"><button id="lsave">Save</button><button class="sec" id="lcancel">Cancel</button>${ed.id && owner ? '<button class="bad" id="ldel">Delete</button>' : ''}</div>
      </div>` : ''}
      ${locTree().map(l => `<div class="trow" style="padding-left:${l.depth * 18}px"><span class="nm">${l.depth ? '└ ' : ''}${esc(l.name)}${l.kind ? ` <span class="mut">· ${LOC_KIND[l.kind]}</span>` : ''}</span>

      ${S.bulk ? bulkPanel() : ''}
      ${ed || S.bulk ? '' : '<div class="row" style="margin-top:12px;flex-wrap:wrap"><button id="ladd">+ Add location</button><button class="sec" id="blist">Add many</button><button class="sec" id="bfloors">Build floors &amp; rooms</button></div>'}
    </div>`;
  const $ = id => document.getElementById(id);
  onEnter('tn', 'tadd');
  $('tadd').onclick = ev => busy(ev.currentTarget, async () => {
    const name = $('tn').value.trim(); if (!name) return setErr('Enter a type name', 'terr');
    const { data, error } = await sb.from('component_types').insert({ workspace_id: S.ws.id, name }).select().single();
    if (error) return setErr(error.message, 'terr');
    await loadMeta(); toast('Type added — now add its fields'); location.hash = '#/type/' + data.id;
  });
  const bl = $('blist'); if (bl) bl.onclick = () => { S.bulk = 'list'; renderSetup(); $('bn')?.focus(); };
  const bf = $('bfloors'); if (bf) bf.onclick = () => { S.bulk = 'floors'; S.bulkOver = {}; renderSetup(); };
  if (S.bulk) wireBulk();

  app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.bulk = null; S.locEdit = { id: null, parent_id: b.dataset.sub }; renderSetup(); $('ln')?.focus(); });

    const l = locById(b.dataset.edit); S.locEdit = { id: l.id, parent_id: l.parent_id || '' }; renderSetup(); $('ln')?.focus();
  });
  if (ed) {
    onEnter('ln', 'lsave');
    $('lcancel').onclick = () => { S.locEdit = null; renderSetup(); };
    $('lsave').onclick = ev => busy(ev.currentTarget, async () => {
      const name = $('ln').value.trim(); if (!name) return setErr('Enter a name', 'lerr');
      const parent_id = $('lp').value || null, kind = $('lk').value || null;
      const row = { name, parent_id, kind };
      if (ed.id) {
        const g = $('lg').value.trim();
        if (g !== locById(ed.id)?.ifc_guid) { if (!GUID_RE.test(g)) return setErr('A GlobalId is 22 characters (letters, numbers, _ and $).', 'lerr'); row.ifc_guid = g; }
      }
      const { error } = ed.id
        ? await sb.from('locations').update(row).eq('id', ed.id)
        : await sb.from('locations').insert({ workspace_id: S.ws.id, ...row });
      if (error) return setErr(error.message, 'lerr');
      S.locEdit = null; await loadMeta(); toast('Location saved'); renderSetup();
    });
    const dl = $('ldel');
    if (dl) dl.onclick = () => {
      if (!confirm('Delete this location? Locations inside it move to the top level, and components here lose their location.')) return;
      busy(dl, async () => {
        const { error } = await sb.from('locations').delete().eq('id', ed.id);
        if (error) return setErr(error.message, 'lerr');
        S.locEdit = null; await loadMeta(); toast('Location deleted'); renderSetup();
      });
    };
  }
}

function floorLabel(n) { return n === 0 ? 'Ground floor' : n < 0 ? 'Basement ' + (-n) : 'Floor ' + n; }
function floorNums(f) {
  const skip = new Set(f.skip), out = [];
  for (let n = f.first, i = 0; out.length < f.floors && i < 400; n++, i++) if (!skip.has(n)) out.push(n);
  return out;
}
function floorPlan(f) {
  const floors = [], rooms = [];
  floorNums(f).forEach((n, i) => {
    floors.push(floorLabel(n));
    const count = f.over && f.over[n] !== undefined ? f.over[n] : f.rooms;
    for (let r = 1; r <= count; r++) {
      const num = f.style === 'floor' ? (Math.abs(n) * 100 + r) : r;
      rooms.push({ floor: i, name: (f.prefix ? f.prefix.trim() + ' ' : '') + (n < 0 && f.style === 'floor' ? 'B' : '') + num });
    }
  });
  return { floors, rooms };
}
function bulkPanel() {
  const cancel = '<button class="sec" id="bcancel" type="button">Cancel</button>';
  if (S.bulk === 'list') return `<div class="panel"><b>Add many locations</b>
    <label for="bp">Inside</label><select id="bp">${locOptions('', '— top level —')}</select>
    <label for="bk">Kind</label><select id="bk">${kindOptions('space')}</select>
    <label for="bn">Names, one per line</label>
    <textarea id="bn" rows="6" placeholder="Room 101&#10;Room 102&#10;Room 103" style="width:100%"></textarea>
    <div class="err" id="berr"></div><div class="row"><button id="bgo" type="button">Add</button>${cancel}</div></div>`;
  return `<div class="panel"><b>Build floors &amp; rooms</b>
    <p class="mut" style="margin:4px 0 0">Creates floors inside a building and rooms inside each floor. You can rename any of them later.</p>
    <label for="bp">Inside (usually a building)</label><select id="bp">${locOptions('', '— top level —')}</select>
    <div class="row"><div style="flex:1"><label for="bf">Floors</label><input id="bf" type="number" min="1" max="60" value="3" inputmode="numeric"></div>
      <div style="flex:1"><label for="b0">First floor number</label><input id="b0" type="number" min="-5" max="100" value="1" inputmode="numeric"></div>
      <div style="flex:1"><label for="br">Usual rooms per floor</label><input id="br" type="number" min="0" max="99" value="10" inputmode="numeric"></div></div>
    <label for="bsk">Skip floor numbers (optional)</label><input id="bsk" placeholder="e.g. 13" inputmode="numeric" autocomplete="off">
    <label>Rooms on each floor</label>
    <p class="mut" style="margin:0 0 6px">Change any floor that has a different number of rooms.</p>
    <div id="bfl"></div>
    <div class="row"><div style="flex:1"><label for="bx">Room name starts with</label><input id="bx" value="Room" autocomplete="off"></div>
      <div style="flex:1"><label for="bs">Numbering</label><select id="bs"><option value="floor">101, 102… (floor × 100 + n)</option><option value="seq">1, 2, 3… on every floor</option></select></div></div>
    <p class="mut" id="bprev" style="margin:8px 0 0"></p>
    <div class="err" id="berr"></div><div class="row"><button id="bgo" type="button">Create</button>${cancel}</div></div>`;
}
function wireBulk() {
  const $ = id => document.getElementById(id);
  $('bcancel').onclick = () => { S.bulk = null; renderSetup(); };
  const flat = () => ({ floors: Math.max(0, Math.min(60, parseInt($('bf')?.value) || 0)), first: parseInt($('b0')?.value) || 0,
    rooms: Math.max(0, Math.min(99, parseInt($('br')?.value) || 0)), prefix: $('bx')?.value || '', style: $('bs')?.value,
    skip: ($('bsk')?.value || '').split(/[ ,;]+/).map(x => parseInt(x)).filter(x => !isNaN(x)), over: S.bulkOver || {} });
  if (S.bulk === 'floors') {
    const prev = () => { const p = floorPlan(flat()); $('bprev').textContent = `Will create ${p.floors.length} floors and ${p.rooms.length} rooms` + (p.rooms[0] ? ` (first room: ${p.rooms[0].name}).` : '.'); };
    const rows = () => {
      const f = flat();
      $('bfl').innerHTML = floorNums(f).map(n => `<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1">${floorLabel(n)}</div>
        <input type="number" min="0" max="99" inputmode="numeric" data-fl="${n}" aria-label="Rooms on ${floorLabel(n)}" value="${f.over[n] !== undefined ? f.over[n] : f.rooms}" style="flex:0 0 96px;text-align:center"></div>`).join('');
      $('bfl').querySelectorAll('[data-fl]').forEach(i => i.oninput = () => {
        const v = Math.max(0, Math.min(99, parseInt(i.value) || 0));
        (S.bulkOver ||= {})[i.dataset.fl] = v; prev();
      });
      prev();
    };
    ['bf', 'b0', 'br', 'bsk'].forEach(i => $(i).oninput = rows);
    ['bx', 'bs'].forEach(i => $(i).oninput = prev);
    rows();
  }
  $('bgo').onclick = ev => busy(ev.currentTarget, async () => {
    const parent_id = $('bp').value || null, ws = S.ws.id;
    if (S.bulk === 'list') {
      const names = [...new Set($('bn').value.split('\n').map(x => x.trim()).filter(Boolean))];
      if (!names.length) return setErr('Type at least one name', 'berr');
      if (names.length > 500) return setErr('Add up to 500 at a time', 'berr');
      const kind = $('bk').value || null;
      const { error } = await sb.from('locations').insert(names.map(name => ({ workspace_id: ws, parent_id, name, kind })));
      if (error) return setErr(error.message, 'berr');
      S.bulk = null; await loadMeta(); toast(names.length + ' locations added'); return renderSetup();
    }
    const f = flat(), plan = floorPlan(f);
    if (!plan.floors.length) return setErr('Enter at least one floor', 'berr');
    if (plan.floors.length + plan.rooms.length > 500) return setErr('That is more than 500 at once. Build it in two steps.', 'berr');
    const fr = await sb.from('locations').insert(plan.floors.map(name => ({ workspace_id: ws, parent_id, name, kind: 'storey' }))).select('id,name');
    if (fr.error) return setErr(fr.error.message, 'berr');
    const idByName = Object.fromEntries(fr.data.map(r => [r.name, r.id]));
    if (plan.rooms.length) {
      const rr = await sb.from('locations').insert(plan.rooms.map(r => ({ workspace_id: ws, parent_id: idByName[plan.floors[r.floor]], name: r.name, kind: 'space' })));
      if (rr.error) { await loadMeta(); return setErr('Floors were created, but rooms failed: ' + rr.error.message, 'berr'); }
    }
    S.bulk = null; S.bulkOver = {}; await loadMeta(); toast(`${plan.floors.length} floors, ${plan.rooms.length} rooms created`); renderSetup();
  });
}

      toast('Task deleted'); redo();

    openFieldForm(app.querySelector(`[data-host="${b.dataset.fedit}"]`), id, defs.find(f => f.id === b.dataset.fedit), redo));

    const arr = [...defs]; const i = arr.findIndex(f => f.id === fid), j = i + dir;

    [arr[i], arr[j]] = [arr[j], arr[i]];
    await Promise.all(arr.map((f, k) => sb.from('field_defs').update({ position: k }).eq('id', f.id)));

  };

    </div>
    <div class="card"><h2>What each role can do</h2>
      <p style="margin:0 0 8px"><b>Owner</b> <span class="mut">the client. Full control. Can appoint or remove maintainers.</span></p>
      <p style="margin:0 0 8px"><b>Maintainer</b> <span class="mut">full control. Can appoint or remove owners, as long as one owner remains.</span></p>
      <p style="margin:0"><b>Member</b> <span class="mut">adds and edits components and records. Cannot delete setup items.</span></p>
    </div>`;
  const ps = document.getElementById('psave');
  if (ps) ps.onclick = ev => busy(ev.currentTarget, async () => {
    const name = document.getElementById('pname').value.trim(), kind = document.getElementById('pkind').value || null;
    if (!name) return setErr('Enter a name', 'perr');
    const { error } = await sb.from('workspaces').update({ name, kind }).eq('id', S.ws.id);
    if (error) return setErr(error.message, 'perr');
    S.ws.name = name; S.ws.kind = kind;
    const w = S.workspaces.find(x => x.id === S.ws.id); if (w) { w.name = name; w.kind = kind; }
    updateTabs(); toast('Saved'); renderTeam();
  });
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(S.ws.join_code); toast('Join code copied'); }
    catch { document.getElementById('jcode').select(); toast('Select and copy the code'); }
  };
  const link = () => inviteUrl(S.ws.join_code);
  document.getElementById('copylink').onclick = async () => {
    try { await navigator.clipboard.writeText(link()); toast('Invite link copied'); }
    catch { prompt('Copy this invite link:', link()); }
  };
  const sh = document.getElementById('sharelink');
  if (sh) sh.onclick = async () => {
    try { await navigator.share({ title: 'Join ' + S.ws.name, text: `Join ${S.ws.name} on Geminus Assets`, url: link() }); } catch {}
  };
  const rc = document.getElementById('resetcode');
  if (rc) rc.onclick = () => {
    if (!confirm('Reset the code? Every invite link and code already sent will stop working. People already in the workspace stay in.')) return;
    busy(rc, async () => {
      const { data, error } = await sb.rpc('reset_join_code', { p_workspace: S.ws.id });
      if (error) return toast(friendlyErr(error.message), true);
      S.ws.join_code = data; const w = S.workspaces.find(x => x.id === S.ws.id); if (w) w.join_code = data;
      toast('New code created'); renderTeam();
    });
  };
  app.querySelectorAll('[data-role]').forEach(sel => sel.onchange = async () => {
    const uid = sel.dataset.role, role = sel.value, prev = S.members[uid].role;
    const name = S.members[uid].display_name || 'this person';
    const losing = uid === me && role === 'member';
    if (uid === me && !confirm(losing ? 'Make yourself a Member? You will lose the ability to manage this workspace.' : `Change your own role to ${ROLE_LABEL[role]}?`)) { sel.value = prev; return; }
    if (uid !== me && role === 'owner' && !confirm(`Make ${name} an owner of ${S.ws.name}?`)) { sel.value = prev; return; }
    sel.disabled = true;
    const { error } = await sb.rpc('set_member_role', { p_workspace: S.ws.id, p_user: uid, p_role: role });
    if (error) { toast(friendlyErr(error.message), true); sel.value = prev; sel.disabled = false; return; }
    await loadMembers(); toast(`${name} is now ${ROLE_LABEL[role]}`); updateTabs(); renderTeam();
  });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const uid = b.dataset.rm, name = S.members[uid]?.display_name || 'this person';
    if (!confirm(uid === me ? `Leave ${S.ws.name}? You will lose access to its data.` : `Remove ${name} from ${S.ws.name}?`)) return;
    busy(b, async () => {
      const { error } = await sb.from('workspace_members').delete().eq('workspace_id', S.ws.id).eq('user_id', uid);
      if (error) return toast(friendlyErr(error.message), true);
      if (uid === me) { toast('You left the workspace'); lastWs.set(''); await loadWorkspaces(); location.hash = '#/'; route(); return; }
      toast(`${name} removed`); await loadMembers(); renderTeam();
    });
  });
}

window.addEventListener('afterprint', () => document.body.classList.remove('print-sticker'));

// ---------- Boot ----------
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) renderAuth();
})();
</script>
</body>
</html>
